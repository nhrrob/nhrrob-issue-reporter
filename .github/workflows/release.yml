name: Release

# When the plugin's Version changes on main, tag v<version> and make a GitHub
# release with that version's changelog from readme.txt. The blog installs
# the plugin from these tags with Composer. Then the same version, with
# .wordpress-org/, goes to WordPress.org; that step is skipped until the
# SVN_USERNAME and SVN_PASSWORD secrets are set.
on:
  push:
    branches: [ "main" ]
    paths: [ "nhrrob-issue-reporter.php", ".github/workflows/release.yml" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

    steps:
    - uses: actions/checkout@v4

    - name: Tag and release the version
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(sed -n 's/^ \* Version: *//p' nhrrob-issue-reporter.php)

        if [ -z "$version" ]; then
          echo "::error::No Version found in the nhrrob-issue-reporter.php header."
          exit 1
        fi

        if gh release view "v$version" >/dev/null 2>&1; then
          echo "v$version is already released."
          exit 0
        fi


        # The notes are this version's lines under "== Changelog ==" in readme.txt.
        awk -v version="$version" '/^= /{ found = ( $2 == version ); next } /^== /{ found = 0 } found' readme.txt > release-notes.md
        gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file release-notes.md
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Production autoloader (no dev packages)
      if: steps.release.outputs.version && env.SVN_USERNAME
      run: composer install --no-dev --no-interaction --optimize-autoloader

    - name: Send the version to WordPress.org
      if: steps.release.outputs.version && env.SVN_USERNAME
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        VERSION: ${{ steps.release.outputs.version }}
