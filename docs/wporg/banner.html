<!doctype html>
<html><head><meta charset="utf-8"><title>Banner</title>
<style>
	html, body { margin: 0; }
	body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
	.banner { position: relative; overflow: hidden; width: 772px; height: 250px; color: #fff;
		background: linear-gradient(120deg, #3b2fb8 0%, #5b52f0 50%, #8b5cf6 100%); }
	.glow { position: absolute; border-radius: 50%; background: #fff; opacity: .07; }
	.text { position: absolute; left: 48px; top: 42px; width: 390px; }
	.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
	.brand svg { width: 38px; height: 38px; }
	h1 { margin: 22px 0 0; font-size: 31px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
	p { margin: 16px 0 0; font-size: 13.5px; opacity: .9; }
	.card { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); width: 262px; padding: 16px; border-radius: 14px;
		background: #fff; color: #14162b; box-shadow: 0 16px 40px rgba(20,10,80,.3); font-size: 11px; }
	.repo { display: flex; align-items: center; gap: 6px; color: #5f6480; font-family: ui-monospace, Menlo, monospace; }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: #1a7f37; }
	.title { margin-top: 7px; font-size: 14px; font-weight: 700; line-height: 1.3; }
	h3 { margin: 9px 0 3px; font-size: 10.5px; font-weight: 600; color: #4338ca; text-transform: uppercase; letter-spacing: .04em; }
	.line { height: 6px; margin-top: 5px; border-radius: 3px; background: #eef0f6; }
	.env { display: flex; justify-content: space-between; margin-top: 4px; }
	.env b { font-weight: 600; }
	.btn { margin-top: 11px; padding: 7px 0; border-radius: 9px; text-align: center; font-weight: 600; color: #fff;
		background: linear-gradient(135deg, #5b63f5 0%, #8b5cf6 100%); }
	.shot { position: relative; height: 74px; border-radius: 9px; background: #f5f6fb; border: 1px solid #e8eaf2; overflow: hidden; }
	.bar { height: 9px; background: #1d2327; }
	.ph { height: 6px; margin: 8px 0 0 12px; border-radius: 3px; background: #dfe2ee; }
	.w60 { width: 60%; } .w40 { width: 40%; }
	.cta { position: absolute; left: 12px; bottom: 10px; padding: 4px 10px; border-radius: 6px; background: #14162b; color: #fff; font-size: 9px; font-weight: 600; }
	.mark { position: absolute; left: 6px; bottom: 5px; width: 72px; height: 28px; border: 2.5px solid #ea580c; border-radius: 4px; }
	.arrow { position: absolute; left: 86px; bottom: 26px; width: 70px; height: 2.5px; background: #ea580c; transform: rotate(-24deg); transform-origin: left; }
	.said { margin-top: 2px; font-size: 12px; font-weight: 600; }
	.chips { display: flex; gap: 4px; margin-top: 8px; }
	.chips span { padding: 1px 7px; border: 1px solid #e8eaf2; border-radius: 99px; font-size: 9.5px; }
	.chips .err { border-color: transparent; background: #feecec; color: #c8282e; }
</style></head>
<body>
<div class="banner">
	<div class="glow" style="width:420px;height:420px;right:-130px;top:-170px"></div>
	<div class="glow" style="width:260px;height:260px;right:170px;top:150px"></div>
	<div class="text">
		<div class="brand">
			<svg viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#fff" fill-opacity=".18"/><g transform="translate(40 38) scale(7.4)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.1V6a3 3 0 116 0v1.1M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 014-4h4a4 4 0 014 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6 13H2M22 13h-4"/></g></svg>
			NHR Issue Reporter
		</div>
		<h1>Client feedback with a marked-up screenshot</h1>
		<p>Report button · Inbox in WordPress · Sent to GitHub</p>
	</div>
	<div class="card">
		<div class="shot">
			<div class="bar"></div>
			<div class="ph w60"></div>
			<div class="ph w40"></div>
			<div class="cta">Book now</div>
			<div class="mark"></div>
			<div class="arrow"></div>
		</div>
		<h3>What’s wrong?</h3>
		<div class="said">“Book now” does nothing on my phone.</div>
		<div class="chips"><span>/book</span><span>Safari · iPhone</span><span class="err">2 errors</span></div>
		<div class="btn">Send feedback</div>
	</div>
</div>
</div>
</body></html>
