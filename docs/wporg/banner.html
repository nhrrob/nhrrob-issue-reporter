<!doctype html>
<html><head><meta charset="utf-8"><title>Banner</title>
<style>
	html, body { margin: 0; }
	body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
	.banner { position: relative; overflow: hidden; width: 772px; height: 250px; color: #fff;
		background: linear-gradient(120deg, #3b2fb8 0%, #5b52f0 50%, #8b5cf6 100%); }
	.glow { position: absolute; border-radius: 50%; background: #fff; opacity: .07; }
	.text { position: absolute; left: 48px; top: 42px; width: 390px; }
	.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
	.brand svg { width: 38px; height: 38px; }
	h1 { margin: 22px 0 0; font-size: 31px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
	p { margin: 16px 0 0; font-size: 13.5px; opacity: .9; }
	.card { position: absolute; right: 44px; top: 30px; width: 262px; padding: 14px 16px; border-radius: 14px;
		background: #fff; color: #14162b; box-shadow: 0 16px 40px rgba(20,10,80,.3); font-size: 11px; }
	.repo { display: flex; align-items: center; gap: 6px; color: #5f6480; font-family: ui-monospace, Menlo, monospace; }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: #1a7f37; }
	.title { margin-top: 7px; font-size: 14px; font-weight: 700; line-height: 1.3; }
	h3 { margin: 10px 0 4px; font-size: 10.5px; font-weight: 600; color: #4338ca; text-transform: uppercase; letter-spacing: .04em; }
	.line { height: 6px; margin-top: 5px; border-radius: 3px; background: #eef0f6; }
	.env { display: flex; justify-content: space-between; margin-top: 4px; }
	.env b { font-weight: 600; }
	.btn { margin-top: 12px; padding: 7px 0; border-radius: 9px; text-align: center; font-weight: 600; color: #fff;
		background: linear-gradient(135deg, #5b63f5 0%, #8b5cf6 100%); }
</style></head>
<body>
<div class="banner">
	<div class="glow" style="width:420px;height:420px;right:-130px;top:-170px"></div>
	<div class="glow" style="width:260px;height:260px;right:170px;top:150px"></div>
	<div class="text">
		<div class="brand">
			<svg viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#fff" fill-opacity=".18"/><g transform="translate(40 38) scale(7.4)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.1V6a3 3 0 116 0v1.1M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 014-4h4a4 4 0 014 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6 13H2M22 13h-4"/></g></svg>
			NHR Issue Reporter
		</div>
		<h1>Report a bug to GitHub without leaving WordPress</h1>
		<p>Plugins &amp; themes · Versions filled in · Duplicates found first</p>
	</div>
	<div class="card">
		<div class="repo"><span class="dot"></span>acme/booking-plugin · New issue</div>
		<div class="title">Checkout button does nothing on mobile</div>
		<h3>What happened</h3>
		<div class="line" style="width:92%"></div>
		<div class="line" style="width:70%"></div>
		<h3>Environment</h3>
		<div class="env"><span>WordPress</span><b>7.1</b></div>
		<div class="env"><span>PHP</span><b>8.4</b></div>
		<div class="btn">Send to GitHub</div>
	</div>
</div>
</body></html>
